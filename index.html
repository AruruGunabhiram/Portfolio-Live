<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary -->
    <title>Gunabhiram Aruru — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer building backend and full-stack systems with Java and Python. Projects, experience and research by Gunabhiram Aruru, MS CS at CU Boulder."
    />
    <meta name="author" content="Gunabhiram Aruru" />

    <!-- Canonical — provisional (domain NOT YET PROVEN, see src/config/site.ts). Update before go-live. -->
    <link rel="canonical" href="https://gunabhiram-aruru.dev/" />

    <!-- Theme -->
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1418" media="(prefers-color-scheme: dark)" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gunabhiram Aruru — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building backend and full-stack systems with Java and Python. Projects, experience and research by Gunabhiram Aruru, MS CS at CU Boulder."
    />
    <meta property="og:url" content="https://gunabhiram-aruru.dev/" />
    <meta property="og:site_name" content="Gunabhiram Aruru" />
    <meta property="og:image" content="https://gunabhiram-aruru.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gunabhiram Aruru portfolio preview" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gunabhiram Aruru — Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer building backend and full-stack systems with Java and Python. Projects, experience and research by Gunabhiram Aruru, MS CS at CU Boulder."
    />
    <meta name="twitter:image" content="https://gunabhiram-aruru.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Gunabhiram Aruru portfolio preview" />

    <!-- Structured data — Person (conservative, no invented claims) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gunabhiram Aruru",
        "url": "https://gunabhiram-aruru.dev/",
        "jobTitle": "Software Engineer",
        "sameAs": [
          "https://github.com/AruruGunabhiram",
          "https://www.linkedin.com/in/gunabhiram-aruru/"
        ],
        "affiliation": {
          "@type": "Organization",
          "name": "University of Colorado Boulder"
        }
      }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

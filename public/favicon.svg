<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gunabhiram Aruru favicon">
  <!-- Restrained geometric mark — matches portfolio palette -->
  <rect width="32" height="32" rx="6" fill="#0e1418" />
  <!-- thin teal accent border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="5.25" fill="none" stroke="#23313b" stroke-width="1.5" />
  <!-- G letterform — geometric, no branding beyond initial -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="18" font-weight="600" letter-spacing="-0.02em" fill="#e6ecef">G</text>
  <!-- subtle accent underline -->
  <rect x="9" y="22.5" width="14" height="1.25" rx="0.6" fill="#5ba8c4" opacity="0.9" />
</svg>
